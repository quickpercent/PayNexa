<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyWallet</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
    color:#17202a;
}

.app{
    max-width:430px;
    margin:auto;
    min-height:100vh;
    background:#f4f6f8;
    padding-bottom:30px;
}

.header{
    background:#111827;
    color:white;
    padding:22px 20px 28px;
    border-radius:0 0 25px 25px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.profile{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#374151;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.balance-box{
    margin-top:28px;
}

.balance-label{
    color:#cbd5e1;
    font-size:13px;
}

.balance{
    font-size:34px;
    font-weight:bold;
    margin-top:5px;
}

.currency{
    font-size:17px;
    color:#cbd5e1;
}

.actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:18px;
}

.action{
    background:white;
    border-radius:15px;
    padding:15px 8px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    cursor:pointer;
}

.action-icon{
    font-size:25px;
    margin-bottom:7px;
}

.action span{
    font-size:12px;
    font-weight:bold;
}

.section{
    padding:0 18px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:8px 0 12px;
}

.section-title h3{
    font-size:17px;
}

.clear{
    font-size:12px;
    color:#dc2626;
    cursor:pointer;
}

.transaction{
    background:white;
    padding:14px;
    border-radius:14px;
    margin-bottom:9px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.tx-left{
    display:flex;
    align-items:center;
    gap:11px;
}

.tx-icon{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#f1f5f9;
    display:flex;
    align-items:center;
    justify-content:center;
}

.tx-name{
    font-weight:bold;
    font-size:14px;
}

.tx-date{
    font-size:11px;
    color:#94a3b8;
    margin-top:3px;
}

.amount{
    font-weight:bold;
    font-size:14px;
}

.income{
    color:#16a34a;
}

.expense{
    color:#dc2626;
}

.empty{
    background:white;
    border-radius:14px;
    padding:25px;
    text-align:center;
    color:#94a3b8;
    font-size:13px;
}

/* Modal */

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:10;
    align-items:flex-end;
    justify-content:center;
}

.modal{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:25px 25px 0 0;
    padding:22px;
}

.modal h2{
    font-size:20px;
    margin-bottom:18px;
}

.input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:16px;
    outline:none;
    margin-bottom:12px;
}

.btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:#111827;
    color:white;
}

.cancel{
    background:#e5e7eb;
    color:#111827;
    margin-top:8px;
}

.pin-screen{
    position:fixed;
    inset:0;
    background:#111827;
    color:white;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.pin-box{
    width:100%;
    max-width:350px;
    text-align:center;
}

.pin-box h1{
    margin-bottom:10px;
}

.pin-box p{
    color:#9ca3af;
    margin-bottom:25px;
}

.pin-input{
    width:100%;
    padding:16px;
    text-align:center;
    font-size:25px;
    letter-spacing:10px;
    border:none;
    border-radius:12px;
    margin-bottom:15px;
}

.error{
    color:#f87171;
    font-size:13px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="top">
            <div class="logo">MyWallet</div>
            <div class="profile">H</div>
        </div>

        <div class="balance-box">
            <div class="balance-label">Available Balance</div>
            <div class="balance">
                <span id="balance">0</span>
                <span class="currency">PKR</span>
            </div>
        </div>
    </div>

    <div class="actions">

        <div class="action" onclick="openModal('add')">
            <div class="action-icon">➕</div>
            <span>Add Money</span>
        </div>

        <div class="action" onclick="openModal('withdraw')">
            <div class="action-icon">➖</div>
            <span>Withdraw</span>
        </div>

        <div class="action" onclick="openModal('send')">
            <div class="action-icon">↗️</div>
            <span>Send</span>
        </div>

    </div>

    <div class="section">

        <div class="section-title">
            <h3>Recent Transactions</h3>
            <div class="clear" onclick="clearTransactions()">Clear</div>
        </div>

        <div id="transactions"></div>

    </div>

</div>


<!-- Modal -->

<div class="modal-bg" id="modalBg">

    <div class="modal">

        <h2 id="modalTitle">Add Money</h2>

        <input
            id="amountInput"
            class="input"
            type="number"
            inputmode="numeric"
            placeholder="Enter amount (PKR)"
        >

        <input
            id="nameInput"
            class="input"
            type="text"
            placeholder="Description / Name"
        >

        <button class="btn" onclick="submitTransaction()">
            Confirm
        </button>

        <button class="btn cancel" onclick="closeModal()">
            Cancel
        </button>

    </div>

</div>


<!-- PIN Screen -->

<div class="pin-screen" id="pinScreen">

    <div class="pin-box">

        <h1>🔐 MyWallet</h1>

        <p>Enter your PIN to continue</p>

        <input
            id="pinInput"
            class="pin-input"
            type="password"
            inputmode="numeric"
            maxlength="4"
            placeholder="••••"
        >

        <button class="btn" onclick="checkPin()">
            Unlock
        </button>

        <div class="error" id="pinError"></div>

    </div>

</div>


<script>

let balance = Number(localStorage.getItem("walletBalance")) || 0;

let transactions =
    JSON.parse(localStorage.getItem("walletTransactions")) || [];

let currentAction = "";


/* Balance */

function updateBalance(){

    document.getElementById("balance").textContent =
        balance.toLocaleString();

    localStorage.setItem(
        "walletBalance",
        balance
    );
}


/* Transactions */

function saveTransactions(){

    localStorage.setItem(
        "walletTransactions",
        JSON.stringify(transactions)
    );

}


/* Display Transactions */

function renderTransactions(){

    const container =
        document.getElementById("transactions");

    container.innerHTML = "";

    if(transactions.length === 0){

        container.innerHTML =
            '<div class="empty">No transactions yet</div>';

        return;
    }

    transactions.slice().reverse().forEach(tx => {

        const div =
            document.createElement("div");

        div.className = "transaction";

        div.innerHTML = `

            <div class="tx-left">

                <div class="tx-icon">
                    ${tx.type === "add" ? "➕" : "➖"}
                </div>

                <div>

                    <div class="tx-name">
                        ${escapeHTML(tx.name)}
                    </div>

                    <div class="tx-date">
                        ${tx.date}
                    </div>

                </div>

            </div>

            <div class="amount ${tx.type === "add" ? "income" : "expense"}">

                ${tx.type === "add" ? "+" : "-"}
                PKR ${Number(tx.amount).toLocaleString()}

            </div>

        `;

        container.appendChild(div);

    });

}


/* Open Modal */

function openModal(action){

    currentAction = action;

    document.getElementById("modalBg").style.display =
        "flex";

    document.getElementById("amountInput").value = "";

    document.getElementById("nameInput").value = "";

    if(action === "add"){

        document.getElementById("modalTitle").textContent =
            "Add Money";

    }

    if(action === "withdraw"){

        document.getElementById("modalTitle").textContent =
            "Withdraw Money";

    }

    if(action === "send"){

        document.getElementById("modalTitle").textContent =
            "Send Money";

    }

}


/* Close Modal */

function closeModal(){

    document.getElementById("modalBg").style.display =
        "none";

}


/* Submit */

function submitTransaction(){

    const amount =
        Number(document.getElementById("amountInput").value);

    let name =
        document.getElementById("nameInput").value.trim();

    if(!amount || amount <= 0){

        alert("Please enter a valid amount.");

        return;
    }

    if(!name){

        name =
            currentAction === "add"
            ? "Money Added"
            : currentAction === "withdraw"
            ? "Money Withdrawn"
            : "Money Sent";

    }


    /* Add */

    if(currentAction === "add"){

        balance += amount;

        addTransaction(
            "add",
            amount,
            name
        );

    }


    /* Withdraw / Send */

    else{

        if(amount > balance){

            alert("Insufficient balance.");

            return;
        }

        balance -= amount;

        addTransaction(
            "expense",
            amount,
            name
        );

    }


    updateBalance();

    saveTransactions();

    renderTransactions();

    closeModal();

}


/* Add Transaction */

function addTransaction(
    type,
    amount,
    name
){

    transactions.push({

        type:type,

        amount:amount,

        name:name,

        date:new Date().toLocaleString()

    });

}


/* Clear */

function clearTransactions(){

    if(!transactions.length){

        return;
    }

    if(confirm("Clear all transactions?")){

        transactions = [];

        saveTransactions();

        renderTransactions();

    }

}


/* Security */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* Start */

updateBalance();

renderTransactions();

</script>

</body>
</html>
